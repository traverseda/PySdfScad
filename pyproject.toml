[project]
name = "pysdfscad"
version = "0.1.0"
description = ""
authors = [{ name = "Alex Davies", email = "traverse.da@gmail.com" }]
requires-python = ">=3.10,<3.12"
readme = "README.md"
dependencies = [
    "sdf",
    "lark>=1.1.5,<2",
    "loguru>=0.6.0,<0.7",
    "click>=8.1.3,<9",
    "appdirs>=1.4.4,<2",
    "astor>=0.8.1,<0.9",
]

[project.scripts]
pysdfscad = "pysdfscad.main:main"
pysdfscad_qtgui = "pysdfscad_qtgui.main:main"

[project.optional-dependencies]
gui = [
    "pyside6>=6.9.3",
    "qscintilla>=2.13.3,<3",
    "pyqtgraph>=0.13.1,<0.14",
    "pyopengl>=3.1.6,<4",
]
dev = [
    "pytest>=7.2.0,<8",
    "black>=22.12.0,<23",
]

[tool.uv]
package = true

[tool.uv.sources]
sdf = { git = "https://github.com/fogleman/sdf.git" }

[tool.setuptools]
packages = ["pysdfscad", "pysdfscad_qtgui"]
